services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-startup-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_startup_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - startup_studio_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-startup-studio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - startup_studio_redis_data:/data

volumes:
  startup_studio_postgres_data:
  startup_studio_redis_data: